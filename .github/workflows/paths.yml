name: Local data, launcher, chat and diary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  paths-and-launcher:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install configuration reader
        run: python -m pip install 'python-dotenv>=1,<2'
      - name: Verify isolated paths, storage, notes, launcher, chat context and pet activity
        run: python -m unittest tests.test_paths tests.test_state_manager tests.test_notes tests.test_launcher tests.test_chat_context tests.test_chat_sessions tests.test_pet_activity -v

  offline-chat:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Verify offline chat, diary, weather and animated pet Qt flow
        run: python -m pytest tests/test_chat_context.py tests/test_agent_context.py tests/test_chat_flow.py tests/test_chat_sessions_ui.py tests/test_diary_flow.py tests/test_pet_animation.py tests/test_pet_panel_animation.py tests/test_weather_flow.py -q
